[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hard-decisions"
version = "0.1.0"
description = "A ProofWriter accuracy benchmark for fast decision models and LLM classifiers, broken down by proof depth and the dataset's other parameters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml", "python-dotenv"]

[project.optional-dependencies]
jev = ["typesafe-sdk"]
llm = ["anthropic>=1", "openai>=2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyflakes"]

[project.scripts]
hd = "hard_decisions.cli:main"

[tool.setuptools.packages.find]
include = ["hard_decisions*"]

[tool.pytest.ini_options]
python_files = ["*_test.py", "test_*.py"]
testpaths = ["hard_decisions", "tests"]
asyncio_mode = "auto"
